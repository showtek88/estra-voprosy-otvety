<style>

.lead{font-size:18px;line-height:30px;max-width:900px;margin:0 0 36px}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 32px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #CACACA;background:#fff;color:var(--head);border-radius:26px;padding:8px 18px;font:600 14px/20px Montserrat,Arial,sans-serif;cursor:pointer;transition:all .15s}

.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

.pnav-num.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pnav-btn{color:var(--blue)}

.qcard h2 a::after{content:"";position:absolute;inset:0}
.qmeta .tag{position:relative;z-index:1}
.more{margin-left:auto;width:44px;height:44px;border:1px solid var(--blue);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--blue);transition:background .2s,color .2s}

.empty{padding:40px;border:1px dashed #CACACA;text-align:center;color:var(--muted)}

.blue-panel .kicker{font-size:14px;opacity:.85;margin-bottom:6px}
.blue-panel h2{color:#fff;margin:0 0 16px;font-size:36px}
.blue-panel p{margin:0;opacity:.9}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.form-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.form-note{font-size:13px;opacity:.85;min-height:19px}

.layout .support-bar{margin-bottom:0;margin-top:48px}
.smenu{border:1px solid var(--line);border-radius:4px;list-style:none;margin:0;padding:0;background:#fff}
.smenu li+li{border-top:1px solid var(--line)}
.smenu a{display:block;padding:20px 32px;color:var(--head);font-size:16px;line-height:24px;position:relative}
.smenu a:hover{color:var(--blue)}
.smenu a.on{font-weight:700;color:var(--head)}

.sb-icon{flex:none;display:flex}
.sb-icon svg{width:50px;height:auto}
.sb-text{margin:0;flex:1;font-size:19px;line-height:30px;color:var(--text)}
.sb-text a{font-weight:700;white-space:nowrap}
.sb-btn{flex:none;padding:17px 36px;font-size:18px;line-height:22px;border-radius:40px}

.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:72px}

.acard b{font-size:16px;line-height:24px}
.acard .go{margin-top:auto;color:var(--blue);font-weight:700;font-size:14px}

/* страница вопроса */
.qpage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;align-items:start;margin-bottom:64px}

.ava{width:44px;height:44px;border-radius:50%;background:var(--blue-tint);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.author b{color:var(--head);font-weight:600;display:block}
.short{background:var(--soft);border-left:4px solid var(--blue);padding:24px 28px;margin:0 0 8px}
.short .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:8px}
.short p{margin:0;font-size:18px;line-height:30px;color:var(--head)}
.body p{margin:0 0 18px}
.body ol,.body ul{margin:0 0 20px;padding-left:24px}
.body li{margin-bottom:10px}
.body li::marker{color:var(--blue);font-weight:700}
figure{margin:28px 0 32px;border:1px solid var(--line);padding:24px}
figcaption{font-size:14px;color:var(--muted);margin-top:12px;line-height:21px}
.tbl{width:100%;border-collapse:collapse;margin:0 0 24px;font-size:15px;line-height:22px}
.tbl th{background:var(--blue);color:#fff;font-size:14px;font-weight:600;text-align:left;padding:12px 11px}
.tbl td{padding:11px;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl tr:nth-child(even) td{background:var(--soft2)}
.tbl-wrap{overflow-x:auto}
.box-estra{border:1px solid var(--blue);padding:24px 28px;margin:32px 0}
.box-estra h3{margin-bottom:10px;color:var(--blue);font-size:18px}
.box-estra p{margin:0 0 14px}
.box-estra .prods{display:flex;flex-wrap:wrap;gap:10px}
.src{font-size:14px;line-height:22px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:32px}
.src ul{margin:6px 0 0;padding-left:18px}
.pending{border:1px dashed #CACACA;padding:28px;color:var(--muted);margin:24px 0}

/* навигация вперёд-назад */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:48px 0 12px}
.pg{border:1px solid var(--line);padding:20px 24px;display:flex;flex-direction:column;gap:6px;color:var(--head);min-height:108px;transition:border-color .2s,background .2s}
.pg:hover{border-color:var(--blue);background:var(--blue-tint);color:var(--head)}
.pg .dir{font-size:13px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:8px}
.pg b{font-size:16px;line-height:24px;font-weight:600}
.pg.next{text-align:right;align-items:flex-end}
.pg.next .dir{justify-content:flex-end}
.pg.ghost{visibility:hidden}
.pg .rub{font-size:12.5px;color:var(--muted)}
.allq{display:flex;justify-content:center;margin:8px 0 0;font-weight:700;font-size:15px}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.kbd span{border:1px solid #CACACA;border-radius:4px;padding:0 6px;font-family:ui-monospace,Menlo,monospace}

/* боковая колонка */
aside{display:grid;gap:16px}
.side{border:1px solid var(--line);padding:24px}
.side h3{font-size:16px;margin-bottom:12px}
.side ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.side li a{display:flex;justify-content:space-between;gap:10px;font-size:14px;line-height:20px;color:var(--text);padding:7px 0}
.side li a:hover,.side li a.on{color:var(--blue)}
.side li a.on{font-weight:700}
.side .n{color:var(--muted);font-weight:400}
.side-cta{background:var(--blue);color:#fff;padding:24px}
.side-cta b{display:block;font-size:17px;line-height:25px;margin-bottom:8px}
.side-cta p{font-size:14px;line-height:21px;margin:0 0 16px;opacity:.9}
.related{display:grid;gap:10px;margin:0 0 8px;padding:0;list-style:none}
.related a{display:block;border-bottom:1px solid var(--line);padding:12px 0;color:var(--head);font-weight:500}
.related a:hover{color:var(--blue)}

/* подвал */
footer{background:var(--blue);color:#fff;margin-top:24px}
.f-top{display:flex;flex-wrap:wrap;gap:16px 48px;padding:56px 0 36px}
.f-top a{color:#fff;font-weight:700}
.f-top a:hover{opacity:.8}
.f-mid{display:flex;flex-wrap:wrap;gap:24px 56px;align-items:center;padding-bottom:36px;border-bottom:1px solid rgba(255,255,255,.25)}
.f-mid a{color:#fff}
.f-mid .big{font-weight:700;font-size:18px}
.f-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:24px 0 32px;font-size:14px;opacity:.85}
.f-bot a{color:#fff}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#333;color:#fff;padding:12px 20px;font-size:14px;transition:transform .25s;z-index:20;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}

/* адаптив */
@media (max-width:1180px){
  .qpage{grid-template-columns:minmax(0,1fr)}
  aside{position:static}
  .cards4{grid-template-columns:repeat(2,1fr)}
  .h-mail{display:none}
}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr);gap:32px}
  .layout aside{order:2}
  .smenu{display:none}
  .h-nav{display:none}
  .h-contacts .h-phone,.h-contacts .btn{display:none}
  .burger{display:flex}
  .h-top{height:72px;gap:20px}
  .blue-panel{grid-template-columns:1fr;padding:40px 28px}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  h1{font-size:30px}
  h2{font-size:23px}
  .lead{font-size:16px;line-height:27px}
  .crumbs{font-size:14px;margin-top:24px}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding:0 16px 6px 0;scrollbar-width:none}
  .chip{flex:none}
  .qcard{padding:22px 20px}
  .qcard h2{font-size:18px}
  .cards4{grid-template-columns:1fr}
  .support-bar{flex-wrap:wrap;padding:24px 20px;gap:16px}
  .sb-text{flex-basis:calc(100% - 74px);font-size:16px;line-height:26px}
  .sb-btn{width:100%}
  .form{grid-template-columns:1fr}
  .pager{grid-template-columns:1fr}
  .pg.next{text-align:left;align-items:flex-start}
  .pg.next .dir{justify-content:flex-start}
  .pg.ghost{display:none}
  .short{padding:20px}
  .short p{font-size:16px;line-height:27px}
  .blue-panel h2{font-size:26px}
  .proto .wrap{font-size:12px}
}
</style>
</head>

  'pusk-dugovoy-zashchity-ot-ozz': `
<h2 id="zachem">Зачем нужен такой пуск</h2>

<p>При дуговом ОЗЗ междуфазные напряжения не меняются, а ток замыкания определяется режимом нейтрали и может быть ниже уставки МТЗ ввода. Пуск по току или по снижению линейного напряжения такую дугу не подтверждает, и дуговая защита отключит повреждение только после перехода в междуфазное КЗ.</p>

<p>Чтобы защита работала и на ранней стадии, вторым признаком берут сигнал от защиты от ОЗЗ. Тогда отключение происходит при совпадении засветки датчика и замыкания на землю.</p>

<p>Это общие технические варианты, а не готовое решение: набор сигналов и логику определяет проект конкретного объекта.</p>

<li><b>Ложная засветка при существующем ОЗЗ.</b> Пока в сети есть замыкание на землю, любая засветка датчика отключит секцию. Это нужно учесть в регламенте работ в РУ.</li>
<li><b>Зона действия.</b> Определите, что отключать при таком пуске: секцию, ввод или питающую сторону. Дуга в кабельном отсеке ввода требует отключения со стороны питания.</li>

<h2 id="reshenie">Как принять решение</h2>

<ol>
<li>Определите режим нейтрали и расчётные токи ОЗЗ.</li>

  'tt-ne-prokhodit-po-nasyshcheniyu': `
<h2 id="chto">Что значит «не проходит по насыщению»</h2>

<p>Для защит от КЗ полная погрешность трансформатора тока при расчётном токе, как правило, не должна превышать 10 % (ПУЭ, п. 3.2.29). Если сердечник насыщается раньше, вторичный ток искажается, и защита может не сработать или сработать с ошибкой.</p>

<p>Проверку делают по заводской кривой предельной кратности K10 = f(zн), где zн — сопротивление вторичной нагрузки. По расчётной кратности находят допустимое сопротивление zн.доп. Действительная нагрузка должна быть не больше допустимой: zн ≤ zн.доп.</p>

<p>В расчётную кратность закладывают поправки. Коэффициент kа учитывает апериодическую составляющую тока КЗ и принимается 1,2–2, а для защит с выдержкой времени 1. Коэффициент α учитывает отличие характеристики конкретного ТТ от типовой и принимается 0,8–0,9.</p>

<h2 id="chto-delat">Что делать, если zн больше zн.доп</h2>

<div class="tbl-wrap"><table class="tbl">
<thead><tr><th>Мера</th><th>Как работает</th><th>Ограничение</th></tr></thead>
<tbody>
<tr><td>Уменьшить сопротивление проводов</td><td>Нагрузка складывается из проводов, входных цепей терминала и контактных соединений. Увеличивают сечение жил, сокращают длину кабеля</td><td>Сечение ограничено зажимами. По ПУЭ минимум для токовых цепей 2,5 мм² Cu или 4 мм² Al (п. 3.4.4)</td></tr>
<tr><td>Перейти на вторичный ток 1 А</td><td>Мощность нагрузки равна I²·z, поэтому ТТ на 1 А при тех же конструктивных параметрах допускает сопротивление в 25 раз больше</td><td>Нужен терминал с токовым входом на 1 А. Входы фазных токов МКЗП-МИКРО 2.0 по методическим указаниям рассчитаны на 5 А</td></tr>
<tr><td>Выбрать ТТ с большим коэффициентом трансформации</td><td>Кратность первичного тока к номинальному снижается</td><td>Уменьшается вторичный ток при минимальном КЗ. Проверьте коэффициент чувствительности</td></tr>
<tr><td>Выбрать ТТ с большей предельной кратностью или мощностью</td><td>Допустимая нагрузка при той же кратности выше</td><td>Габариты и стоимость, место в ячейке</td></tr>
<tr><td>Развести измерения и защиты по разным обмоткам</td><td>Приборы учёта не добавляют нагрузку защитной обмотке</td><td>Нужна свободная обмотка. ПУЭ рекомендует разные обмотки для измерений и РЗ (п. 3.2.30)</td></tr>
</tbody>
</table></div>

<p>Учтите и переходный режим. Пока апериодическая составляющая не затухла, насыщение наступает раньше, чем при синусоидальном токе. Для токовых отсечек без выдержки закладывайте kа = 1,2–2.</p>

<h2 id="poryadok">Порядок проверки</h2>

<ol>
<li>Определите максимальный ток, при котором защита должна работать точно.</li>
<li>Рассчитайте расчётную кратность с коэффициентами kа и α.</li>
<li>По заводской кривой K10 = f(zн) найдите zн.доп.</li>
<li>Рассчитайте действительную нагрузку: провода, вход терминала, переходные сопротивления.</li>
<li>Если zн &gt; zн.доп, примените меры из таблицы и повторите расчёт.</li>
</ol>

<p><b>Подробнее в статье:</b> <a href="${SITE}/articles/kak-vybrat-transformator-toka-dlya-ustroystv-rza/" target="_blank" rel="noopener">Как выбрать трансформатор тока для устройств РЗА</a>.</p>

<div class="src">Источники

<li>ПУЭ, 7-е изд., пп. 3.2.29, 3.2.30, 3.4.4.</li>

  'rezistivnoe-zazemlenie-i-zashchity': `
<h2 id="tok">Что меняется в токе замыкания</h2>

<p>В сети с изолированной нейтралью ток ОЗЗ задаёт ёмкость сети. Резистор в нейтрали добавляет активную составляющую, и режим меняется.</p>

<div class="tbl-wrap"><table class="tbl">
<thead><tr><th>Режим</th><th>Чем определяется ток ОЗЗ</th></tr></thead>
<tbody>
<tr><td>Изолированная нейтраль</td><td>Ёмкостью сети</td></tr>
<tr><td>Высокоомное резистивное заземление</td><td>Активный ток резистора близок к ёмкостному току сети</td></tr>

</tbody>
</table></div>

<h2 id="zashchity">Что меняется в защитах</h2>

<ul>
<li><b>Принцип.</b> В изолированной сети защита отстраивается от собственного ёмкостного тока линии и срабатывает от ёмкостного тока остальной сети. При низкоомном заземлении по повреждённому присоединению течёт ток резистора, он намного больше ёмкостного, и различить повреждённое присоединение проще. Как правило, применяют токовую защиту на ТТНП.</li>
<li><b>Действие.</b> В изолированной сети защита от ОЗЗ может действовать на сигнал (ПУЭ, пп. 3.2.96, 3.2.99). В сети с резистивным заземлением длительное протекание тока в десятки ампер недопустимо, поэтому защита, как правило, действует на отключение.</li>
<li><b>Уставки.</b> Ток срабатывания выбирают от тока резистора и тока небаланса, а не от ёмкостного тока сети. Чувствительность проверяют по минимальному току через резистор, в том числе при замыкании через переходное сопротивление.</li>
<li><b>Другие защиты.</b> Дуговая защита на дугу при ОЗЗ не получит пуск по току МТЗ ввода: <a href="#/q/dugovaya-zashchita-ne-otklyuchila-vvod">Почему дуговая защита не отключила ввод при дуге на шинах?</a></li>
</ul>

<h2 id="proverit">Что проверить до перехода на резистивное заземление</h2>

<ol>
<li>Режим работы резистора. Он может быть рассчитан на длительное протекание тока или на кратковременное, с автоматическим отключением при отказе защиты. Во втором случае сеть переходит в режим изолированной нейтрали с замыканием на землю, что опасно перенапряжениями.</li>
<li>Расчёт токов ОЗЗ при всех схемах сети и положениях секционных выключателей.</li>
<li>Чувствительность и селективность защит от ОЗЗ на всех присоединениях, выдержки времени и действие на отключение.</li>

<p>ПУЭ рекомендуют защиты на переменном оперативном токе, если это упрощает и удешевляет установку (п. 3.2.31). Источником переменного оперативного тока для защит от КЗ служат, как правило, трансформаторы тока защищаемого элемента, допускаются трансформаторы напряжения и собственных нужд (п. 3.2.32).</p>

<h2 id="kak">Как работает разомкнутый треугольник</h2>

<p>Вторичные обмотки трёх фаз ТН соединяют последовательно в разомкнутый треугольник и измеряют напряжение на выводах цепи. В нормальном режиме фазные напряжения симметричны, их сумма равна нулю, и на выводах напряжения нет. При КЗ без земли сумма тоже равна нулю.</p>

<p>При пуске асинхронного двигателя сопротивление ротора мало, и ток статора максимален. Начальный пусковой ток равен току трёхфазного КЗ за сопротивлением неподвижного двигателя. Он состоит из периодической составляющей и апериодической, которая затухает за несколько периодов.</p>

<ul>
<li>Периодическая составляющая при неподвижном роторе обычно в 4–8 раз превосходит номинальный ток, в отдельных случаях больше.</li>
<li>Пик тока с учётом апериодической составляющей выше действующего значения периодической.</li>
<li>Время спада тока до номинального зависит от параметров двигателя и нагрузки: при пуске под нагрузкой ротор разгоняется медленнее, и спад длится дольше.</li>
</ul>

<tr><td>Апериодическая составляющая</td><td>В первые периоды пуска пик тока выше периодической составляющей, терминал видит больший ток</td><td>Электромеханические отсечки отстраивали выдержкой 0,04–0,06 с. Для микропроцессорного терминала запас проверяют по осциллограмме реального пуска</td></tr>
<tr><td>Насыщение ТТ</td><td>Апериодическая составляющая насыщает сердечник, вторичный ток искажается</td><td>Проверка ТТ: <a href="#/q/tt-ne-prokhodit-po-nasyshcheniyu">Что делать, если трансформатор тока не проходит по насыщению?</a></td></tr>
<tr><td>Пуск при нетиповых условиях</td><td>Пуск после остановки, с нагрузкой на валу, при пониженном напряжении</td><td>Загрубление уставок на время пуска по признаку предшествующей паузы без тока</td></tr>

<h2 id="vybor">Как выбрать и проверить уставку</h2>

<ol>
<li>Получите пусковой ток по данным завода-изготовителя двигателя или по испытаниям. Определяющим условием для отсечки, как правило, служит отстройка от пускового тока при полном напряжении сети.</li>
<li>Рассчитайте ток срабатывания с запасом kн = 1,2.</li>
<li>Проверьте чувствительность при двухфазном КЗ на выводах двигателя. Для крупных двигателей с большими пусковыми токами однорелейная схема может не дать нужной чувствительности, тогда применяют двухрелейную.</li>

<h2 id="zachem">Зачем экран пропускают через ТТНП</h2>

<p>ТТНП суммирует токи всех проводников в окне. У кабеля с металлической оболочкой или бронёй наиболее вероятно замыкание жилы на оболочку. Ток замыкания идёт по жиле, а возвращается по оболочке, причём оба проводника проходят через окно ТТНП в противоположных направлениях. Если оболочку заземлить мимо окна, их потоки взаимно компенсируются, и ТТНП не видит замыкания.</p>

<p>Вторая причина — токи, которые могут идти по оболочке и броне в других режимах. Они искажают измерение, и их влияние нужно компенсировать.</p>

<h2 id="kak">Как выполнить</h2>

<ol>
<li>Оболочку и броню кабеля на участке от воронки (концевой муфты) до ТТНП изолируйте от земли.</li>
<li>Заземляющий проводник присоедините к воронке кабеля и пропустите через окно ТТНП.</li>
<li>Тогда ток, идущий по оболочке или броне, возвращается по заземляющему проводу, и магнитные потоки от этих токов в магнитопроводе взаимно уничтожаются. ТТНП измеряет только ток жил.</li>
<li>Магнитопровод ТТНП надёжно изолируйте от брони кабеля.</li>
</ol>

<div class="tbl-wrap"><table class="tbl">

<tr><td>Экран заземлён мимо окна ТТНП</td><td>Токи жилы и оболочки взаимно компенсируются. Защита не работает</td></tr>

<li>Работу схемы проверяют первичным током при наладке.</li>
</ul>

   short:'Время указано в руководстве по эксплуатации конкретного устройства. МКЗП-МИКРО 2.0 сохраняет работоспособность при перерыве питания не менее 4 с, ЭСТРА-ДЗТ не менее 2 с. После перерывов любой длительности устройство не срабатывает ложно.'},
  {r:'ozz', slug:'odin-ttnp-na-dva-kabelya', q:'Можно ли ставить один ТТНП на два кабеля?',
   short:'Можно, если оба кабеля одного присоединения проходят через окно ТТНП вместе и размер окна это позволяет. Другой вариант: свой ТТНП на каждый кабель с параллельным соединением вторичных обмоток.',
   article:{t:'Защита от ОЗЗ в сетях 6–35 кВ', u:'/articles/zashchita-ot-odnofaznykh-zamykaniy-na-zemlyu-v-setyakh-6-35-kv/'}},
  {r:'dvigateli-i-linii', slug:'otsechka-dvigatelya-pri-puske', q:'Почему токовая отсечка двигателя срабатывает при пуске?',
   short:'Отсечка отстроена от пускового тока с недостаточным запасом. В первые периоды пуска апериодическая составляющая и погрешность трансформаторов тока увеличивают ток, который видит терминал. Уставку проверяют по осциллограмме реального пуска.'},
  {r:'ozz', slug:'ekran-kabelya-cherez-ttnp', q:'Как пропускать экран кабеля через ТТНП?',
   short:'Если экран заземлён со стороны концевой муфты, а ТТНП стоит ниже, заземляющий проводник экрана пропускают обратно через окно ТТНП. Тогда токи по экрану взаимно компенсируются и не попадают в измерение.',
   article:{t:'Защита от ОЗЗ в сетях 6–35 кВ', u:'/articles/zashchita-ot-odnofaznykh-zamykaniy-na-zemlyu-v-setyakh-6-35-kv/'}},
  {r:'dvigateli-i-linii', slug:'tok-kz-v-kontse-vl-raven-toku-nagruzki', q:'Что делать, если ток КЗ в конце ВЛ 10 кВ почти равен току нагрузки?',
   short:'МТЗ головного выключателя здесь не обеспечит чувствительность. Линию делят на участки пунктами секционирования с реклоузерами, у каждого своя МТЗ. При двустороннем питании нужна направленная защита.'}
];
Q.forEach(x => { x.date = x.date || '21.10.2026'; });
Q.forEach(x => { if (!x.full && FULL[x.slug]) x.full = FULL[x.slug]; });
const rubName = s => (RUBRICS.find(r => r.slug === s) || {}).name;
const count = s => Q.filter(x => x.r === s).length;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arrowR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const arrowL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const app = document.getElementById('app');
const fakeUrl = document.getElementById('fakeUrl');

function crumbs(items){
  return '<nav class="crumbs" aria-label="Хлебные крошки">' + items.map((it, i) =>
    (i ? '<span class="sep">—</span>' : '') + (it.href ? `<a href="${it.href}">${esc(it.t)}</a>` : `<span>${esc(it.t)}</span>`)
  ).join('') + '</nav>';
}

function formBlock(){
  return `
  <section class="support-bar" id="form">
    <span class="sb-icon" aria-hidden="true"><svg width="62" height="72" viewBox="0 0 62 72" fill="none"><rect x="12" y="12" width="46" height="56" rx="6" fill="#E8F0F8"/><rect x="3" y="3" width="46" height="56" rx="6" fill="#fff" stroke="#00549F" stroke-width="3"/><path d="M14 18h24M14 26h24M14 34h24M14 42h24M14 50h14" stroke="#00549F" stroke-width="3" stroke-linecap="round"/></svg></span>
    <p class="sb-text">Получите бесплатную круглосуточную тех. поддержку по номеру <a href="tel:+78003332083">+7 (800) 333-20-83</a> или оставьте нам заявку</p>
    <a class="btn sb-btn" href="${SITE}/support/" target="_blank" rel="noopener">Задать вопрос</a>
  </section>`;
}

function articlesBlock(){
  const A = [
    {k:'ОЗЗ', t:'Защита от однофазных замыканий на землю в сетях 6–35 кВ', u:'/articles/zashchita-ot-odnofaznykh-zamykaniy-na-zemlyu-v-setyakh-6-35-kv/'},
    {k:'Автоматика', t:'Автоматический ввод резерва: принцип работы и уставки', u:'/articles/avtomaticheskiy-vvod-rezerva-avr-printsip-raboty-ustavki-i-primenenie-v-setyakh-6-35-kv/'},
    {k:'Оперативный ток', t:'Дешунтирование в РЗА: принцип, схема, реализация', u:'/articles/deshuntirovanie-v-rza-printsip-skhema-i-realizatsiya-na-mikroprotsessornom-terminale/'},
    {k:'Проектирование', t:'Проектирование релейной защиты 6–35 кВ', u:'/articles/proektirovanie-releynoy-zashchity-6-35-kv-sostav-proekta-etapy-i-normy/'}
  ];
  return `<h2>Подробнее в статьях</h2><div class="cards4">` + A.map(a =>
    `<a class="acard" href="${SITE}${a.u}" target="_blank" rel="noopener"><span class="k">${a.k}</span><b>${a.t}</b><span class="go">Читать статью →</span></a>`).join('') + '</div>';
}

const PER_PAGE = 5; // в прототипе 5, чтобы пагинация была видна; на сайте 30
const hubHref = (filter, page) => (filter ? `#/tema/${filter}` : '#') + (page > 1 ? `/page/${page}` : '/');
const BASE = '/support/voprosy-po-rza/';
const hubUrl = (filter, page) => (filter ? `${BASE}tema/${filter}/` : BASE) + (page > 1 ? `?PAGEN_1=${page}` : '');
const SECTION = 'Вопросы по релейной защите';
const SUPPORT_MENU = [
  {t:'Техническая поддержка', u:'/support/index.php'},
  {t:'Помощь в проектировании и типовые решения', u:'/support/help/'},
  {t:'Программное обеспечение', u:'/support/software/'},
  {t:'Вопросы по устройствам ЭСТРА', u:'/support/chasto-zadavaemye-voprosy/'},
  {t:SECTION, here:true},
  {t:'Инструкции и чек-листы', u:'/support/instruktsii-i-chek-listy/'},
  {t:'Видео-инструкции', u:'/support/video-instructions/'}
];
function supportMenu(){
  return '<nav aria-label="Раздел поддержки"><ul class="smenu">' + SUPPORT_MENU.map(m => m.here
    ? `<li><a class="on" href="#/" aria-current="page">${m.t}</a></li>`
    : `<li><a href="${SITE}${m.u}" target="_blank" rel="noopener">${m.t}</a></li>`).join('') + '</ul></nav>';
}
const baseCrumbs = () => [{t:'Главная', href:SITE + '/'}, {t:'Техническая поддержка', href:SITE + '/support/'}];

function pagination(filter, page, pages){
  if (pages < 2) return '';
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
    else if (nums.at(-1) !== '…') nums.push('…');
  }
  const prev = page > 1
    ? `<a class="pnav-btn" href="${hubHref(filter, page - 1)}" rel="prev" aria-label="Предыдущая страница">${arrowL}</a>`
    : `<span class="pnav-btn off" aria-hidden="true">${arrowL}</span>`;
  const next = page < pages
    ? `<a class="pnav-btn" href="${hubHref(filter, page + 1)}" rel="next" aria-label="Следующая страница">${arrowR}</a>`
    : `<span class="pnav-btn off" aria-hidden="true">${arrowR}</span>`;
  return `<nav class="pnav" aria-label="Страницы">${prev}${nums.map(n =>
    n === '…' ? '<span class="pnav-gap">…</span>'
    : n === page ? `<span class="pnav-num on" aria-current="page">${n}</span>`
    : `<a class="pnav-num" href="${hubHref(filter, n)}">${n}</a>`).join('')}${next}</nav>`;
}

function renderHub(filter, page){
  const all = filter ? Q.filter(x => x.r === filter) : Q;
  const pages = Math.max(1, Math.ceil(all.length / PER_PAGE));
  page = Math.min(Math.max(1, page || 1), pages);
  const from = (page - 1) * PER_PAGE;
  const list = all.slice(from, from + PER_PAGE);
  const chips = [`<a class="chip ${!filter ? 'on' : ''}" href="#/">Все <span class="n">${Q.length}</span></a>`]
    .concat(RUBRICS.map(r => `<a class="chip ${filter === r.slug ? 'on' : ''}" href="#/tema/${r.slug}">${r.name} <span class="n">${count(r.slug)}</span></a>`)).join('');
  const cards = list.length ? list.map(x => `
    <article class="qcard">
      <h2><a href="#/q/${x.slug}">${esc(x.q)}</a></h2>
      <p>${esc(x.short)}</p>
      <div class="qmeta">
        <a class="tag" href="#/tema/${x.r}">${rubName(x.r)}</a>
        <span>Обновлено ${x.date}</span>
        <span class="more" aria-hidden="true">${arrowR}</span>
      </div>
    </article>`).join('') : '<div class="empty">В этой рубрике пока нет вопросов</div>';
  const crumbItems = baseCrumbs().concat([{t:SECTION, href: (filter || page > 1) ? '#/' : null}]);
  if (filter) crumbItems.push({t: rubName(filter), href: page > 1 ? hubHref(filter, 1) : null});
  const title = filter ? rubName(filter) + ': вопросы и ответы' : 'Вопросы и ответы по релейной защите 6–35 кВ';
  const lead = page === 1 ? `<p class="lead">Короткие ответы инженеров НПП «ЭСТРА» на популярные вопросы. Как узнать пароль, сбросить аварию, настроить дешунтирование или разобраться с сообщением о неисправности на устройствах ЭСТРА, читайте в разделе <a href="${SITE}/support/chasto-zadavaemye-voprosy/" target="_blank" rel="noopener">«Вопросы по устройствам ЭСТРА»</a>.</p>` : '';
  const shown = all.length ? `<p class="pnav-info">Вопросы ${from + 1}–${from + list.length} из ${all.length}</p>` : '';
  app.innerHTML = crumbs(crumbItems) + `
    <h1>${title}</h1>
    <div class="layout">
      <aside>${supportMenu()}</aside>
      <div>
        ${lead}
        <div class="chips" role="navigation" aria-label="Рубрики">${chips}</div>
        <div class="qlist">${cards}</div>
        ${pagination(filter, page, pages)}
        ${pages > 1 ? shown : ''}
        ${formBlock()}
      </div>
    </div>
    ${articlesBlock()}`;
  document.title = title + (page > 1 ? `, страница ${page}` : '') + ' | ЭСТРА';
  fakeUrl.textContent = hubUrl(filter, page);
}

function neighbors(idx){
  const cur = Q[idx];
  const prev = idx > 0 && Q[idx - 1].r === cur.r ? Q[idx - 1] : null;
  let next = null, nextOtherRubric = false;
  if (idx < Q.length - 1) { next = Q[idx + 1]; nextOtherRubric = next.r !== cur.r; }
  return {prev, next, nextOtherRubric};
}

function renderQuestion(slug){
  const idx = Q.findIndex(x => x.slug === slug);
  if (idx < 0) { location.hash = '#/'; return; }
  const x = Q[idx];
  const {prev, next, nextOtherRubric} = neighbors(idx);
  const used = new Set([x.slug, prev && prev.slug, next && next.slug]);
  let rel = Q.filter(y => y.r === x.r && !used.has(y.slug));
  if (rel.length < 3) rel = rel.concat(Q.filter(y => y.r !== x.r && !used.has(y.slug)).slice(0, 3 - rel.length));
  const body = x.full ? x.full : `
    <div class="pending"><b>Полный ответ готовится.</b> В прототипе он написан только для первого вопроса раздела: <a href="#/q/${Q[0].slug}">${esc(Q[0].q)}</a></div>
    ${x.article ? `<p><b>Подробнее в статье:</b> <a href="${SITE}${x.article.u}" target="_blank" rel="noopener">${x.article.t}</a></p>` : ''}`;
  const pg = (item, dir) => {
    if (!item) return '<div class="pg ghost"></div>';
    const label = dir === 'prev' ? `${arrowL} Предыдущий вопрос` : (nextOtherRubric ? `Следующая рубрика ${arrowR}` : `Следующий вопрос ${arrowR}`);
    const rub = dir === 'next' && nextOtherRubric ? `<span class="rub">${rubName(item.r)}</span>` : '';
    return `<a class="pg ${dir}" href="#/q/${item.slug}" data-nav="${dir}"><span class="dir">${label}</span>${rub}<b>${esc(item.q)}</b></a>`;
  };
  const side = `
    <aside>
      ${supportMenu()}
      <div class="side"><h3>Рубрики</h3><ul>${RUBRICS.map(r =>
        `<li><a class="${r.slug === x.r ? 'on' : ''}" href="#/tema/${r.slug}"><span>${r.name}</span><span class="n">${count(r.slug)}</span></a></li>`).join('')}</ul></div>
      <div class="side-cta"><b>Не нашли ответ?</b><p>Бесплатная круглосуточная техподдержка: <a href="tel:+78003332083" style="color:#fff;font-weight:700;white-space:nowrap">+7 (800) 333-20-83</a></p><a class="btn btn--white" href="#form" data-scroll="form">Задать вопрос</a></div>
    </aside>`;
  app.innerHTML = crumbs(baseCrumbs().concat([{t:SECTION, href:'#/'}, {t:rubName(x.r), href:'#/tema/' + x.r}, {t: shortCrumb(x.q)}])) + `
    <h1>${esc(x.q)}</h1>
    <div class="layout">
      ${side}
      <div class="qmain">
        <div class="author"><div class="ava">Э</div><div><b>Ведущий инженер НПП «ЭСТРА»</b>Опубликовано ${x.date} · <a href="#/tema/${x.r}">${rubName(x.r)}</a></div></div>
        <div class="short"><div class="lbl">Коротко</div><p>${esc(x.short)}</p></div>
        <div class="body">${body}</div>
        <nav class="pager" aria-label="Соседние вопросы">${pg(prev, 'prev')}${pg(next, 'next')}</nav>
        <div class="allq"><a href="#/">Все вопросы</a></div>
        <div class="kbd">Можно листать стрелками <span>←</span> <span>→</span></div>
        <h2>Другие вопросы по теме</h2>
        <ul class="related">${rel.map(y => `<li><a href="#/q/${y.slug}">${esc(y.q)}</a></li>`).join('')}</ul>
        ${formBlock()}
      </div>
    </div>`;
  document.title = x.q + ' | ЭСТРА';
  fakeUrl.textContent = `${BASE}${x.slug}/`;
}

function shortCrumb(q){
  const w = q.replace(/\?$/, '').split(' ');
  return w.length > 6 ? w.slice(0, 6).join(' ') + '…' : q;
}

function route(){
  const h = location.hash.replace(/^#/, '') || '/';
  const m1 = h.match(/^\/q\/([^/]+)/);
  const m2 = h.match(/^\/tema\/([^/]+)/);
  const pm = h.match(/\/page\/(\d+)/);
  const page = pm ? parseInt(pm[1], 10) : 1;
  if (m1) renderQuestion(m1[1]);
  else if (m2 && RUBRICS.some(r => r.slug === m2[1])) renderHub(m2[1], page);
  else renderHub(null, page);
  window.scrollTo({top: 0, behavior: 'instant'});
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-scroll]');
  if (a) { e.preventDefault(); const el = document.getElementById(a.dataset.scroll); if (el) el.scrollIntoView({behavior:'smooth'}); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowLeft') { const p = document.querySelector('[data-nav="prev"]'); if (p) location.hash = p.getAttribute('href'); }
  if (e.key === 'ArrowRight') { const n = document.querySelector('[data-nav="next"]'); if (n) location.hash = n.getAttribute('href'); }
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
